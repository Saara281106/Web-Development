<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <fieldset>
    <legend> <h1>FORM 1</h1></legend>
    <form action="">
        <h1>Event Registration</h1>
        <label for="a">Name:</label> 
        <br>
        <input type="text" id="a">
        <br>
        <label for="b">Email:</label>
        <br>
        <input type="email" id="b">
        <br>
        <label for="c">Phone:</label>
        <br>
        <input type="number" id="c">
        <br>
        <label for="d">Occupation</label>
        <br>
        <select name="occu" id="d">
            <option value="others">Others</option>
            <option value="student">Student</option>
            <option value="pro">Professional</option>
        </select>
        <br>
        <label for="e">Topics of Interest</label>
        <br>
        <input type="checkbox" id="e">
        <br>
        <label for="">HTML</label>
        <br>
        <input type="checkbox" id="e">
        <br>
        <label for="">CSS</label>
        <br>
        <input type="checkbox" id="e">
        <br>
        <label for="">JavaScript</label>
        <br>
        <label for="f">Comments:</label>
        <br>
        <textarea name="text" id="f" cols="60px" rows="8px"></textarea>
        <button type="submit">Register</button>
    </form>
    </fieldset>

    <br>
    <br>

    <fieldset>
        <legend>FORM 2</legend>
        <form action="">
            <h1>Job Application</h1>
            <label for="a">Name:</label> 
        <br>
        <input type="text" id="a">
        <br>
        <label for="b">Email:</label>
        <br>
        <input type="email" id="b">
        <br>
        <label for="c">Phone:</label>
        <br>
        <input type="number" id="c">
        <br>
        <label for="r">Resume</label>
        <br>
        <input type="file" id="r">
        <br>
        <label for="ex">Experience(Years):</label>
        <br>
        <input type="number" id="ex" min="0" max="50">
        <br>

        </form>
    </fieldset>
</body>
</html>
